question_patterns:
  - question: Why are complaints rising in Toronto West?
    intended_path: Support Case -> Incident -> Network Asset -> Telemetry Event
  - question: Which towers are causing 5G Home Internet issues?
    intended_path: Network Asset -> Incident -> Service Instance -> Subscription -> Product
  - question: Which enterprise customers are affected by this outage?
    intended_path: Incident -> Support Case -> Account -> Customer
  - question: What is the SLA exposure for unresolved incidents?
    intended_path: Incident -> SLA Exposure -> Account
  - question: Which work orders should be prioritized?
    intended_path: Work Order -> Incident -> SLA Exposure -> Support Case
  - question: Which customers have high churn risk after repeat service issues?
    intended_path: Churn Risk -> Customer -> Support Case -> Incident

